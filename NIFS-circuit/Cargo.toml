[package]
name = "NIFS-circuit"
version = "0.1.0"
edition = "2021"

[dependencies]
nova-snark = {path = "../Nova"}
subroutines = {git="https://github.com/EspressoSystems/hyperplonk"}
transcript = {git="https://github.com/EspressoSystems/hyperplonk"}

ff = { version = "0.13.0", features = ["derive"] }
digest = "0.10"
sha3 = "0.10"
rayon = "1.10"
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
rand_chacha = "0.3"
subtle = "2.6.1"
halo2curves = { version = "0.9.0", features = ["std", "bits", "derive_serde"] }
generic-array = "1.2.0"
num-bigint = { version = "0.4.6", features = ["serde", "rand"] }
num-traits = "0.2.19"
num-integer = "0.1.46"
serde = { version = "1.0.217", features = ["derive"] }
bincode = { version = "2", features = ["serde", "std"] }
bitvec = "1.0"
blitzar = { version = "4.4.2", optional = true }
byteorder = "1.4.3"
thiserror = "2.0.11"
once_cell = "1.18.0"
itertools = "0.14.0"
proptest = "1.9.0"
rand = "0.8.5"
num = "0.4.3"

# arkworks dependencies
ark-ff = { version = "^0.4.0", default-features = false }
ark-poly = { version = "^0.4.0", default-features = false }
ark-std = { version = "^0.4.0", default-features = false }
ark-bls12-381 = { version = "0.4.0", default-features = false, features = [ "curve" ] }
ark-serialize =  { version = "^0.4.0", default-features = false }
secp256k1 = "0.32.0-beta.2"