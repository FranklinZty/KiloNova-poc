# Common parameter contract, P0 freeze (2026-10-05).
# Values are what the code hard-codes today, not the general symbols of PLAN.md §5.1.
# P3 generalises [protocol]; P9's pilot freezes [machine.experiments].

[protocol]
version          = 1          # HFS transcript v1 (Nova/src/kilonova/transcript.rs)
t                = 3          # relation.rs compute_v_from_coeffs returns t+1 = 4 claims
d                = 2          # R1CS
mu               = 1          # running ACCS per fold
nu               = 1          # incoming CCCS per fold
num_io           = 2          # kilonova/mod.rs setup enforces
deg_x            = 3          # X-round evaluations at {0,1,2,3} = d+1
deg_y            = 2          # Y-round evaluations at {0,1,2}
gamma_powers     = [0, 1, 2, 3]            # running M0..M2, zero-check (docs/protocol-spec.md N7)
delta_powers     = [0, 1, 2, 3, 4, 5, 6]   # running M0..M2, running z, new M0..M2 (N8)
fold_field       = "E::Base"  # v1 (recursion path) only: KNOWN ISSUE B15, fixed in v2 below; recursion moves to v2 in P5

[protocol_v2]                 # P3 native-field HFS (Nova/src/kilonova/hfs, docs/protocol-spec.md section 8)
version          = 2          # transcript.rs::v2::HFS_TRANSCRIPT_VERSION
fold_field       = "E::Scalar"   # D1 = (a) Nova fork + CycleFold (decided 2026-11-09): HFS in-circuit over E1::Scalar, E1 group ops in a CycleFold circuit over E2::Scalar
template         = "any (t, q, d): kn_ccs::Template / hfs::CcsTemplate"
mu_nu            = "mu running + nu incoming, mu + nu >= 1"
deg_x            = "max(d + 1, 2)"
deg_y            = 2
sumcheck_order   = "round i binds bit i (least significant first), no reversal"
sponge           = "Poseidon over E::Scalar (E::RO2)"            # D1 = (a), decided 2026-11-09
commitment_absorb = "x limbs, y limbs (4 x 64 bits, LSB first), is_infinity"
tags             = ["0x4b4e484653020001", "0x4b4e484653020002", "0x4b4e484653020003", "0x4b4e484653020004"]

[recursion_v2]                # P5, Nova/src/kilonova/ivc, docs/protocol-spec.md section 9 (P4: section 9.8)
version          = 2          # ivc::IVC_VERSION (1 = P5; 2 = P4: family digest, in-circuit phi, verifier without schedule)
d1               = "(a) Nova fork + CycleFold"
primary          = "one augmented circuit per predicate over E1::Scalar (Pallas), padded to common (m, num_w), num_io = 1"
cyclefold        = "R1CS over E2::Scalar = E1::Base, inputs rho,[k],W_run,W_inc,W_out,(M_run[j],M_out[j]); 8 + 4t (Direct) or 7 (Span)"
cyclefold_fold   = "Nova relaxed-R1CS NIFS, n inputs, running instance absorbed, tag 0x4b4e434600010001"
tags             = ["0x4b4e495643020001 (link)", "0x4b4e495643020002 (trace)"]   # IVC v2 (P4); v1 used 0x...4301...
selection        = "phi(i, z_i) evaluated in the circuit of predicate k, enforced = k (P4, G4)"
schedule_program = "Scheduled<P>: prog register, digits of b = max(1, ceil(log2 K)) bits, L = b*floor(253/b) decomposed bits"
verifier         = "verify(pp, n, z0) -> (z_n, trace, last_id); verify_schedule compares the recovered trace (layer Trace)"

[family]                      # P4, Nova/src/kilonova/family, docs/protocol-spec.md section 10
version          = 1          # family::FAMILY_VERSION
member_encoding  = "kn_ccs::encode layout (KNCCS 0x01), canonical entries"
digest           = "SHA3-256 -> 250-bit field element over (version, label, arity, num_io, selector, ids, member SHA3 digests, key labels/sizes)"
k_max_fixture    = 16         # ivc::fixtures::MAX_CHAIN_K
templates        = ["R1CS (t=3, d=2)", "R1CS + native power rows (t=5, d=5)"]

[pcd]                         # P6, Nova/src/kilonova/pcd, docs/protocol-spec.md section 11
version          = 1          # pcd::PCD_VERSION (link hash, tree hash, tree CycleFold accumulator layout)
family           = "[leaf/0 .. leaf/(K_leaf-1), merge, dummy]; K = K_leaf + 2; leaf members = P4 chain members (default K_leaf = 2)"
mu_nu_vs_a       = "merge: mu = a running + nu = a incoming per HFS fold (mu + nu = 2a, never a); leaf/dummy: mu = nu = 0 (base case, no verifier); chain (section 9): a = 1, mu = nu = 1"
arity_a          = [2, 4, 8]  # a = 2 mandatory; 4, 8 stretch (see docs/P6-report.md for what ran)
leaves_L         = 64         # W4 default; small trees L = 4, 5, 6 in the tests
cyclefold        = "multi-input: rho, [k_0..k_{nu-1}], W_0..W_{mu+nu-1}, W_out, (M_0[j]..M_{mu-1}[j], M_out[j])_j; Horner with the 128-bit rho; Direct a = 2: 31 inputs"
cyclefold_folds  = "a - 1 relaxed-relaxed folds (tag 0x4b4e434600020001) + 1 fresh fold (tag 0x4b4e434600020002); u and X as 4 x 64-bit limbs"
tags             = ["0x4b4e504344010001 (link)", "0x4b4e504344010002 (leaf)", "0x4b4e504344010003 (node)", "0x4b4e504344010004 (dummy)"]
target_result    = "R = sum_p beta^p F_{k_p}(x_p), beta = 7"
range_bits       = 32         # positions, L, widths range-checked in-circuit
dummy_rule       = "maximal padding subtrees beyond L (lo >= L, parent lo < L), one dummy proof each"
root_verifier    = "verify_root(pp) -> (task_id, L, a, [0, a^d), R, tree hash); layers Input, Statement, LinkHash, Decider, CycleFold, RootIncoming"
main_threads     = 1          # main records single-threaded; parallel-latency records separately labelled (experiment p6-tree-parallel)

[setup]
max_iterations   = 12         # kilonova::MAX_SETUP_ITERATIONS
max_constraints  = 1048576    # kilonova::MAX_SETUP_CONSTRAINTS (2^20)

[crypto]
curves             = "Pallas/Vesta"   # BN254/Grumpkin re-evaluated at the P3.0 decision
num_challenge_bits = 128
num_hash_bits      = 250
bn_limb_width      = 64
bn_n_limbs         = 4
witness_commitment = "Pedersen (provider::pedersen)"
pcs                = "IPA (provider::ipa_pc::EvaluationEngine), single-step test only"
ro                 = "Poseidon with domain tags (transcript.rs)"
zero_knowledge     = false

[machine.dev]                 # correctness work only; never used for formal timings
ram_gb           = 16
test_threads     = 1          # required on 16 GB
profile          = "release"  # debug builds are too slow for setup tests

[machine.experiments]         # PLAN.md §5.2; to be frozen at the P9 pilot
host             = "TBD: dedicated Linux bare metal or pinned VM, >= 64 GB RAM"
mem_cap_fraction = 0.8
timeout_min      = 30
threads_main     = 1
seeds            = [101, 202, 303]
